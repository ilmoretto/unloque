<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unloque - Recuperador & Auditor de ZIP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="icon">🔓</span>
                <span class="brand">Unloque</span>
                <span class="badge">v0.1.0</span>
            </div>
            <div class="header-status" id="headerStatus">
                <span class="status-dot"></span> Pronto
            </div>
        </header>

        <main class="main-content">
            <div class="dashboard-grid">
                <!-- Coluna de Configuração / Upload -->
                <section class="card config-card">
                    <h2>📁 Arquivo Alvo & Dicionário</h2>
                    
                    <div class="form-group">
                        <label>Arquivo ZIP Protegido:</label>
                        <div class="dropzone" id="zipDropzone">
                            <input type="file" id="zipInput" accept=".zip">
                            <p class="dropzone-text" id="zipLabel">📂 Arraste o arquivo .ZIP ou clique para selecionar</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Dicionário (Wordlist):</label>
                        <select id="wordlistSelect" class="select-control">
                            <option value="wordlists/">Todas as Wordlists da pasta wordlists/ (Consolidada)</option>
                            <option value="wordlists/senhas_comuns.txt">senhas_comuns.txt (Inclui 'matrix')</option>
                            <option value="wordlists/senhas_brasil.txt">senhas_brasil.txt (Brasil / Futebol)</option>
                            <option value="wordlists/pins_numericos.txt">pins_numericos.txt (PINs 4/6/8 dígitos)</option>
                            <option value="wordlists/top1000.txt">top1000.txt (Top 1.000 globais)</option>
                        </select>
                    </div>

                    <div class="action-buttons">
                        <button id="btnStart" class="btn btn-primary">🚀 Iniciar Recuperação</button>
                        <button id="btnStop" class="btn btn-danger" disabled>🛑 Parar</button>
                    </div>
                </section>

                <!-- Coluna de Telemetria e Progresso Visual -->
                <section class="card telemetry-card">
                    <h2>📊 Telemetria em Tempo Real</h2>

                    <div class="metrics-grid">
                        <div class="metric-box">
                            <span class="metric-label">Progresso</span>
                            <span class="metric-value" id="valPercent">0.0%</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label">Velocidade</span>
                            <span class="metric-value" id="valRate">0 s/s</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label">Testadas</span>
                            <span class="metric-value" id="valTested">0 / 0</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label">Tempo</span>
                            <span class="metric-value" id="valElapsed">0.0s</span>
                        </div>
                    </div>

                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
                    </div>

                    <!-- Card de Resultado Destacado -->
                    <div class="result-box" id="resultBox" style="display: none;">
                        <div class="result-title">🎉 SENHA ENCONTRADA COM SUCESSO!</div>
                        <div class="result-password" id="resultPassword">------</div>
                        <div class="result-details" id="resultDetails"></div>
                    </div>

                    <!-- Terminal de Logs -->
                    <div class="log-terminal" id="logTerminal">
                        <div class="log-line text-muted">[SISTEMA] Aguardando início do ataque...</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
